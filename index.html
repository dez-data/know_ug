<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" id="brand-home" aria-label="know_uganda home">
        <span class="brand-mark" aria-hidden="true">k</span>
        <span class="brand-name">know_uganda<span class="brand-subtitle">Know before you go</span></span>
      </a>
      <div class="language">
        <label for="language-select">Language</label>
        <select id="language-select" aria-describedby="translation-note"></select>
        <span class="translation-note" id="translation-note">Live translation powered by Sunbird Sunflower</span>
      </div>
    </header>
    <main id="app" aria-live="polite"></main>
    <p class="footer-note">Plan your visit with confidence. Always confirm details at the office.</p>
  </div>
  <script>
    const app = document.getElementById("app");
    const languageSelect = document.getElementById("language-select");
    let currentProcess = null;
    let questionIndex = 0;
    let answers = {};
    let activeScreen = "home";
    let translationRequestId = 0;
    const translationCache = Object.create(null);

    APP_CONTENT.languages.forEach((language) => {
      const option = document.createElement("option");
      option.value = language.code;
      option.textContent = language.name;
      languageSelect.append(option);
    });

    function renderHome() {
      currentProcess = null;
      activeScreen = "home";
      translationRequestId += 1;
      app.innerHTML = `
        <div class="demo-notice"><span class="notice-icon" aria-hidden="true">ⓘ</span><span>Sample content for demo. Not official. Confirm at the office.</span></div>
        <p class="eyebrow">Government services, made clearer</p>
        <h1>Know before<br>you go.</h1>
        <p class="intro">Get a simple checklist before you visit an office. Choose a service to get started.</p>
        <h2 class="section-heading">What do you need help with?</h2>
        <div class="process-list">
          ${APP_CONTENT.processes.map((process, index) => `
            <button type="button" class="process-card" data-process="${process.id}">
              <span class="process-icon" aria-hidden="true">${["▣", "▤", "⌂"][index]}</span>
              <span class="process-info"><span class="process-name">${process.name}</span><span class="process-agency">${process.agency}</span></span>
              <span class="card-arrow" aria-hidden="true">›</span>
            </button>
          `).join("")}
        </div>`;
      app.querySelectorAll("[data-process]").forEach((button) => {
        button.addEventListener("click", () => startQuestions(button.dataset.process));
      });
    }

    function startQuestions(processId) {
      currentProcess = APP_CONTENT.processes.find((process) => process.id === processId);
      activeScreen = "questions";
      translationRequestId += 1;
      questionIndex = 0;
      answers = {};
      renderQuestion();
    }

    function renderQuestion() {
      const question = currentProcess.questions[questionIndex];
      app.innerHTML = `
        <div class="demo-notice"><span class="notice-icon" aria-hidden="true">ⓘ</span><span>Sample content for demo. Not official. Confirm at the office.</span></div>
        <div class="step-indicator"><span class="step-dots" aria-hidden="true">${currentProcess.questions.map((_, index) => `<span class="step-dot ${index <= questionIndex ? "active" : ""}"></span>`).join("")}</span><span>Question ${questionIndex + 1} of ${currentProcess.questions.length}</span></div>
        <h1 class="screen-heading">${currentProcess.name}</h1>
        <p class="screen-description">${currentProcess.description}</p>
        <section class="question-card" aria-labelledby="question-title">
          <h2 id="question-title">${question.text}</h2>
          <div class="option-list">${question.options.map((option) => `
            <button type="button" class="option" data-answer="${option}"><span>${option}</span><span class="option-mark" aria-hidden="true">›</span></button>
          `).join("")}</div>
        </section>
        <div class="actions">${questionIndex > 0 ? '<button type="button" class="button secondary" id="back-question">Back</button>' : '<button type="button" class="button secondary" id="back-home">Back</button>'}</div>`;
      app.querySelectorAll("[data-answer]").forEach((button) => {
        button.addEventListener("click", () => {
          answers[question.id] = button.dataset.answer;
          if (questionIndex < currentProcess.questions.length - 1) {
            questionIndex += 1;
            renderQuestion();
          } else {
            renderChecklist();
          }
        });
      });
      const back = document.getElementById(questionIndex > 0 ? "back-question" : "back-home");
      back.addEventListener("click", () => {
        if (questionIndex > 0) {
          questionIndex -= 1;
          renderQuestion();
        } else {
          renderHome();
        }
      });
    }

    function confirmation(value) {
      return value || APP_CONTENT.confirm;
    }

    function checklistText() {
      const displayedText = (key, fallback) => {
        const field = app.querySelector(`[data-translation-key="${key}"]`);
        return field ? field.textContent : fallback;
      };
      const lines = [
        `${currentProcess.name} (${currentProcess.agency})`,
        `Sample content for demo. Not official. Confirm at the office.`,
        "",
        "Documents required:"
      ];
      const documents = currentProcess.documents.length ? currentProcess.documents : [APP_CONTENT.confirm];
      documents.forEach((document, index) => {
        const checkbox = app.querySelector(`[data-document="${index}"]`);
        lines.push(`${checkbox && checkbox.checked ? "[x]" : "[ ]"} ${displayedText(`documents:${index}`, document)}`);
      });
      lines.push(
        `Fees: ${confirmation(currentProcess.fees)}`,
        `Where to go: ${displayedText("where", confirmation(currentProcess.where))}`,
        `Expected timeline: ${displayedText("timeline", confirmation(currentProcess.timeline))}`,
        `Common rejection reasons: ${currentProcess.rejectionReasons.length
          ? currentProcess.rejectionReasons.map((reason, index) => displayedText(`reasons:${index}`, reason)).join("; ")
          : displayedText("reasons:0", APP_CONTENT.confirm)}`,
        `Source: ${currentProcess.sourceUrl || APP_CONTENT.confirm}`,
        `Last verified: ${currentProcess.lastVerified || APP_CONTENT.confirm}`
      );
      return lines.join("\n");
    }

    async function copyChecklist() {
      const status = document.getElementById("copy-status");
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(checklistText());
        } else {
          const field = document.createElement("textarea");
          field.value = checklistText();
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.append(field);
          field.select();
          const copied = document.execCommand("copy");
          field.remove();
          if (!copied) throw new Error("Clipboard copy was not available.");
        }
        status.textContent = "Checklist copied.";
      } catch (error) {
        status.textContent = "Could not copy. Please select and copy the checklist manually.";
      }
    }

    function renderChecklist() {
      activeScreen = "checklist";
      const documents = currentProcess.documents.length ? currentProcess.documents : [APP_CONTENT.confirm];
      const reasons = currentProcess.rejectionReasons.length ? currentProcess.rejectionReasons : [APP_CONTENT.confirm];
      const source = currentProcess.sourceUrl
        ? `<a href="${currentProcess.sourceUrl}" target="_blank" rel="noopener noreferrer">${currentProcess.sourceUrl}</a>`
        : APP_CONTENT.confirm;
      app.innerHTML = `
        <div class="demo-notice"><span class="notice-icon" aria-hidden="true">ⓘ</span><span>Sample content for demo. Not official. Confirm at the office.</span></div>
        <section class="result-head">
          <div class="result-title-row"><div><span class="agency-tag">${currentProcess.agency}</span><h1 class="screen-heading">${currentProcess.name}</h1><p class="screen-description">${currentProcess.description}</p></div></div>
          <div class="source-panel">
            <div class="source-line"><span class="source-label">Source:</span><span class="source-value">${source}</span></div>
            <div class="source-line"><span class="source-label">Last verified:</span><span class="source-value">${confirmation(currentProcess.lastVerified)}</span></div>
          </div>
          <p class="answer-summary">Your answers: ${currentProcess.questions.map((question) => `${question.text.replace(/\?$/, "")} — ${answers[question.id]}`).join(" · ")}</p>
        </section>
        <div class="checklist">
          <section class="check-section"><h2>Documents required</h2><div class="check-items">${documents.map((document, index) => `
            <label class="check-item"><input type="checkbox" data-document="${index}"><span class="translation-field ${document === APP_CONTENT.confirm ? "confirm-text" : ""}" data-translation-key="documents:${index}">${document}</span></label>
          `).join("")}</div></section>
          <section class="check-section"><h2>Fees</h2><div class="check-item"><span class="confirm-text">${confirmation(currentProcess.fees)}</span></div></section>
          <section class="check-section"><h2>Where to go</h2><div class="check-item"><span class="translation-field confirm-text" data-translation-key="where">${confirmation(currentProcess.where)}</span></div></section>
          <section class="check-section"><h2>Expected timeline</h2><div class="check-item"><span class="translation-field confirm-text" data-translation-key="timeline">${confirmation(currentProcess.timeline)}</span></div></section>
          <section class="check-section"><h2>Common rejection reasons</h2><div class="check-items">${reasons.map((reason, index) => `<div class="check-item"><span class="translation-field confirm-text" data-translation-key="reasons:${index}">${reason}</span></div>`).join("")}</div></section>
        </div>
        <section class="check-section" aria-label="Translation">
          <p class="translation-label">Translated by AI (Sunbird Sunflower). Confirm details at the office.</p>
          <p class="translation-status" id="translation-status" role="status" aria-live="polite"></p>
        </section>
        <button type="button" class="button copy-button" id="copy-checklist">Copy checklist</button>
        <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
        <div class="home-link"><button type="button" id="start-over">← Choose another service</button></div>`;
      document.getElementById("copy-checklist").addEventListener("click", copyChecklist);
      document.getElementById("start-over").addEventListener("click", renderHome);
      applyChecklistLanguage();
    }

    function translationEntries(process) {
      const documents = process.documents.length ? process.documents : [APP_CONTENT.confirm];
      const reasons = process.rejectionReasons.length ? process.rejectionReasons : [APP_CONTENT.confirm];
      return [
        ...documents.map((text, index) => ({ key: `documents:${index}`, text })),
        { key: "where", text: confirmation(process.where) },
        { key: "timeline", text: confirmation(process.timeline) },
        ...reasons.map((text, index) => ({ key: `reasons:${index}`, text }))
      ];
    }

    function protectTranslationTerms(text, process) {
      const terms = [...(process.protectedTerms || []), ...(text.match(/\b\d+(?:[.,:/-]\d+)*%?\b/g) || [])]
        .filter((term, index, list) => term && list.indexOf(term) === index)
        .sort((left, right) => right.length - left.length);
      const protectedValues = [];
      let preparedText = text;
      terms.forEach((term) => {
        const token = `ZXQKEEP${protectedValues.length}QXZ`;
        preparedText = preparedText.split(term).join(token);
        protectedValues.push({ term, token });
      });
      return {
        text: preparedText,
        restore(translatedText) {
          let restoredText = translatedText;
          protectedValues.forEach(({ term, token }) => {
            if (!restoredText.includes(token)) throw new Error("Translation did not preserve protected terms.");
            restoredText = restoredText.split(token).join(term);
          });
          return restoredText;
        }
      };
    }

    async function requestTranslation(text, languageCode, process) {
      const protectedText = protectTranslationTerms(text, process);
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      try {
        const response = await fetch("/api/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source_language: "eng",
            target_language: languageCode,
            text: protectedText.text
          }),
          signal: controller.signal
        });
        if (!response.ok) throw new Error("Translation request failed.");
        const data = await response.json();
        if (typeof data.translated_text !== "string" || !data.translated_text.trim()) {
          throw new Error("Translation response was empty.");
        }
        return protectedText.restore(data.translated_text);
      } finally {
        clearTimeout(timeout);
      }
    }

    function showTranslations(translations) {
      app.querySelectorAll(".translation-field").forEach((field) => {
        field.textContent = translations[field.dataset.translationKey] || field.textContent;
      });
    }

    async function applyChecklistLanguage() {
      if (activeScreen !== "checklist" || !currentProcess) return;
      const status = document.getElementById("translation-status");
      const languageCode = languageSelect.value;
      const requestId = ++translationRequestId;
      const entries = translationEntries(currentProcess);
      const englishValues = Object.fromEntries(entries.map(({ key, text }) => [key, text]));

      if (languageCode === "eng") {
        showTranslations(englishValues);
        status.textContent = "";
        return;
      }

      const cacheKey = `${currentProcess.id}:${languageCode}`;
      if (translationCache[cacheKey]) {
        showTranslations(translationCache[cacheKey]);
        status.textContent = "";
        return;
      }

      showTranslations(englishValues);
      status.textContent = "Translating...";
      try {
        const uniqueTexts = [...new Set(entries.map(({ text }) => text))];
        const translatedTexts = await Promise.all(uniqueTexts.map((text) =>
          requestTranslation(text, languageCode, currentProcess)
        ));
        if (requestId !== translationRequestId || languageCode !== languageSelect.value) return;
        const translationsByText = Object.fromEntries(uniqueTexts.map((text, index) => [text, translatedTexts[index]]));
        const translations = Object.fromEntries(entries.map(({ key, text }) => [key, translationsByText[text]]));
        translationCache[cacheKey] = translations;
        showTranslations(translations);
        status.textContent = "";
      } catch (error) {
        if (requestId !== translationRequestId || languageCode !== languageSelect.value) return;
        showTranslations(englishValues);
        status.textContent = "Translation unavailable, showing English.";
      }
    }

    languageSelect.addEventListener("change", () => {
      if (activeScreen === "checklist") applyChecklistLanguage();
    });

    document.getElementById("brand-home").addEventListener("click", (event) => {
      event.preventDefault();
      renderHome();
    });
    renderHome();
  </script>
</body>
</html>
